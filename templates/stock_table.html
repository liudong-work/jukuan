<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>股票列表 - 量化交易系统 v2.0.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .stock-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
        }
        .table-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
        }
        .stock-table {
            margin: 0;
        }
        .stock-table th {
            background: #f8f9fa;
            border: none;
            font-weight: 600;
            color: #495057;
        }
        .stock-table td {
            vertical-align: middle;
            border: none;
            border-bottom: 1px solid #e9ecef;
        }
        .stock-table tbody tr:hover {
            background-color: #f8f9fa;
        }
        .positive-change {
            color: #dc3545;
            font-weight: 600;
        }
        .negative-change {
            color: #28a745;
            font-weight: 600;
        }
        .zero-change {
            color: #6c757d;
        }
        .market-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .filter-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stats-cards {
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .stat-card h4 {
            margin: 0;
            font-size: 1.5rem;
        }
        .stat-card p {
            margin: 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-arrow-left me-2"></i>
                返回主页
            </a>
            <span class="navbar-text">
                股票列表 - 实时价格与涨跌幅
            </span>
        </div>
    </nav>

    <!-- 头部 -->
    <section class="stock-header">
        <div class="container text-center">
            <h1 class="display-6 fw-bold mb-3">
                <i class="fas fa-chart-line me-3"></i>
                股票列表
            </h1>
            <p class="lead">实时价格、涨跌幅、成交量等详细信息</p>
        </div>
    </section>

    <!-- 主要内容 -->
    <section class="py-4">
        <div class="container">
            <!-- 统计卡片 -->
            <div class="row stats-cards">
                <div class="col-md-3">
                    <div class="stat-card">
                        <h4 id="totalStocks">-</h4>
                        <p>总股票数</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <h4 id="upStocks">-</h4>
                        <p>上涨股票</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <h4 id="downStocks">-</h4>
                        <p>下跌股票</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <h4 id="flatStocks">-</h4>
                        <p>平盘股票</p>
                    </div>
                </div>
            </div>

            <!-- 筛选和操作 -->
            <div class="filter-section">
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <label class="form-label">选择市场:</label>
                        <select class="form-select" id="marketSelect" onchange="loadStockList()">
                            <option value="CN">A股市场 (CN)</option>
                            <option value="HK">港股市场 (HK)</option>
                            <option value="US">美股市场 (US)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">显示数量:</label>
                        <select class="form-select" id="limitSelect" onchange="loadStockList()">
                            <option value="20">20只</option>
                            <option value="50" selected>50只</option>
                            <option value="100">100只</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">排序方式:</label>
                        <select class="form-select" id="sortSelect" onchange="sortTable()">
                            <option value="change_pct">按涨跌幅</option>
                            <option value="volume">按成交量</option>
                            <option value="current_price">按价格</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" onclick="loadStockList()">
                            <i class="fas fa-sync me-2"></i>刷新数据
                        </button>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-12 text-center">
                        <button class="btn btn-warning me-2" onclick="clearCache()">
                            <i class="fas fa-trash me-2"></i>清理缓存
                        </button>
                        <button class="btn btn-info me-2" onclick="showCacheInfo()">
                            <i class="fas fa-info-circle me-2"></i>缓存信息
                        </button>
                    </div>
                </div>
            </div>

            <!-- 股票表格 -->
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table stock-table" id="stockTable">
                        <thead>
                            <tr>
                                <th>代码</th>
                                <th>名称</th>
                                <th>最新价</th>
                                <th>涨跌额</th>
                                <th>涨跌幅</th>
                                <th>开盘价</th>
                                <th>最高价</th>
                                <th>最低价</th>
                                <th>成交量</th>
                                <th>成交额</th>
                                <th>市场</th>
                                <th>行业</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody">
                            <tr>
                                <td colspan="12" class="loading">
                                    <i class="fas fa-spinner fa-spin me-2"></i>
                                    加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 分页信息 -->
            <div class="text-center mt-3">
                <small class="text-muted">
                    最后更新: <span id="lastUpdate">-</span> | 
                    数据来源: 聚宽数据服务
                </small>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentStocks = [];
        let currentSort = 'change_pct';

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadStockList();
        });

        // 加载股票列表
        async function loadStockList() {
            const market = document.getElementById('marketSelect').value;
            const limit = document.getElementById('limitSelect').value;
            
            try {
                // 显示加载状态
                document.getElementById('stockTableBody').innerHTML = `
                    <tr>
                        <td colspan="12" class="loading">
                            <i class="fas fa-spinner fa-spin me-2"></i>
                            正在获取${market}市场数据...
                        </td>
                    </tr>
                `;
                
                const response = await fetch(`/api/v1/jq/stocks?market=${market}&limit=${limit}`);
                const data = await response.json();
                
                if (response.ok) {
                    currentStocks = data.stocks;
                    updateStats(currentStocks);
                    renderStockTable(currentStocks);
                    document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
                } else {
                    document.getElementById('stockTableBody').innerHTML = `
                        <tr>
                            <td colspan="12" class="text-center text-danger">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                加载失败: ${data.detail}
                            </td>
                        </tr>
                    `;
                }
            } catch (error) {
                console.error('加载股票列表失败:', error);
                document.getElementById('stockTableBody').innerHTML = `
                    <tr>
                        <td colspan="12" class="text-center text-danger">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            网络错误，请检查连接
                        </td>
                    </tr>
                `;
            }
        }

        // 更新统计信息
        function updateStats(stocks) {
            const total = stocks.length;
            const up = stocks.filter(s => s.change_pct > 0).length;
            const down = stocks.filter(s => s.change_pct < 0).length;
            const flat = stocks.filter(s => s.change_pct === 0).length;
            
            document.getElementById('totalStocks').textContent = total;
            document.getElementById('upStocks').textContent = up;
            document.getElementById('downStocks').textContent = down;
            document.getElementById('flatStocks').textContent = flat;
        }

        // 渲染股票表格
        function renderStockTable(stocks) {
            if (!stocks || stocks.length === 0) {
                document.getElementById('stockTableBody').innerHTML = `
                    <tr>
                        <td colspan="12" class="text-center text-muted">
                            暂无数据
                        </td>
                    </tr>
                `;
                return;
            }
            
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = '';
            
            stocks.forEach(stock => {
                const row = document.createElement('tr');
                
                // 涨跌幅样式
                const changeClass = stock.change_pct > 0 ? 'positive-change' : 
                                  stock.change_pct < 0 ? 'negative-change' : 'zero-change';
                
                // 市场标签
                const marketClass = getMarketClass(stock.market);
                
                row.innerHTML = `
                    <td><strong>${stock.code}</strong></td>
                    <td>${stock.name}</td>
                    <td><strong>${stock.current_price.toFixed(2)}</strong></td>
                    <td class="${changeClass}">
                        ${stock.change > 0 ? '+' : ''}${stock.change.toFixed(2)}
                    </td>
                    <td class="${changeClass}">
                        ${stock.change_pct > 0 ? '+' : ''}${stock.change_pct.toFixed(2)}%
                    </td>
                    <td>${stock.open_price.toFixed(2)}</td>
                    <td>${stock.high_price.toFixed(2)}</td>
                    <td>${stock.low_price.toFixed(2)}</td>
                    <td>${formatVolume(stock.volume)}</td>
                    <td>${formatAmount(stock.amount)}</td>
                    <td><span class="badge ${marketClass} market-badge">${stock.market}</span></td>
                    <td><small>${stock.industry}</small></td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // 获取市场样式类
        function getMarketClass(market) {
            const marketClasses = {
                '深市主板': 'bg-primary',
                '创业板': 'bg-success',
                '科创板': 'bg-warning',
                '沪市主板': 'bg-info',
                '其他': 'bg-secondary'
            };
            return marketClasses[market] || 'bg-secondary';
        }

        // 格式化成交量
        function formatVolume(volume) {
            if (volume >= 100000000) {
                return (volume / 100000000).toFixed(2) + '亿';
            } else if (volume >= 10000) {
                return (volume / 10000).toFixed(2) + '万';
            }
            return volume.toLocaleString();
        }

        // 格式化成交额
        function formatAmount(amount) {
            if (amount >= 100000000) {
                return (amount / 100000000).toFixed(2) + '亿';
            } else if (amount >= 10000) {
                return (amount / 10000).toFixed(2) + '万';
            }
            return amount.toLocaleString();
        }

        // 排序表格
        function sortTable() {
            const sortBy = document.getElementById('sortSelect').value;
            currentSort = sortBy;
            
            if (currentStocks.length === 0) return;
            
            // 排序
            currentStocks.sort((a, b) => {
                let aVal = a[sortBy];
                let bVal = b[sortBy];
                
                // 处理特殊排序
                if (sortBy === 'change_pct') {
                    return bVal - aVal; // 涨跌幅降序
                } else if (sortBy === 'volume') {
                    return bVal - aVal; // 成交量降序
                } else if (sortBy === 'current_price') {
                    return bVal - aVal; // 价格降序
                }
                
                return 0;
            });
            
            renderStockTable(currentStocks);
        }

        // 自动刷新（每5分钟）
        setInterval(() => {
            if (document.visibilityState === 'visible') {
                loadStockList();
            }
        }, 5 * 60 * 1000);

        // 清理缓存
        async function clearCache() {
            try {
                const response = await fetch('/api/v1/jq/cache', {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showAlert('缓存清理成功！', 'success');
                    console.log('缓存清理结果:', result);
                    
                    // 清理成功后重新加载数据
                    setTimeout(() => {
                        loadStockList();
                    }, 1000);
                } else {
                    showAlert(`缓存清理失败: ${result.detail}`, 'danger');
                }
            } catch (error) {
                console.error('清理缓存失败:', error);
                showAlert('清理缓存时发生错误', 'danger');
            }
        }

        // 显示缓存信息
        async function showCacheInfo() {
            try {
                // 这里可以添加获取缓存信息的API调用
                showAlert('缓存信息功能开发中...', 'info');
            } catch (error) {
                console.error('获取缓存信息失败:', error);
                showAlert('获取缓存信息失败', 'danger');
            }
        }

        // 显示提示信息
        function showAlert(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(alertDiv);
            
            // 3秒后自动消失
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 3000);
        }
    </script>
</body>
</html>
