<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>策略管理 - 量化交易系统 v2.0.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .strategy-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
        }
        .strategy-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
        }
        .strategy-item {
            border-left: 4px solid #007bff;
            padding: 20px;
            margin: 15px 0;
            background: white;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .strategy-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .strategy-active {
            border-left-color: #28a745;
        }
        .strategy-inactive {
            border-left-color: #6c757d;
        }
        .backtest-form {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }
        .indicator-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
        }
        .parameter-badge {
            background: #e9ecef;
            color: #495057;
            padding: 0.25rem 0.5rem;
            border-radius: 15px;
            margin: 0.25rem;
            display: inline-block;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-chart-line me-2"></i>
                量化交易系统 v2.0.0
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">实时监控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/jq-demo">聚宽数据</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stock-table">股票表格</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/trading">交易管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/strategy">策略管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analysis">分析</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/docs">API文档</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 头部 -->
    <section class="strategy-header">
        <div class="container text-center">
            <h1 class="display-6 fw-bold mb-3">
                <i class="fas fa-cogs me-3"></i>
                策略管理
            </h1>
            <p class="lead">量化策略管理、技术指标计算、策略回测</p>
        </div>
    </section>

    <!-- 主要内容 -->
    <section class="py-4">
        <div class="container">
            <!-- 快速操作 -->
            <div class="row mb-4">
                <div class="col-md-12 text-center">
                    <button class="btn btn-primary btn-lg me-3" data-bs-toggle="modal" data-bs-target="#createStrategyModal">
                        <i class="fas fa-plus me-2"></i>创建新策略
                    </button>
                    <button class="btn btn-success btn-lg me-3" data-bs-toggle="modal" data-bs-target="#backtestModal">
                        <i class="fas fa-chart-line me-2"></i>运行回测
                    </button>
                    <button class="btn btn-info btn-lg" onclick="refreshStrategies()">
                        <i class="fas fa-sync-alt me-2"></i>刷新策略
                    </button>
                    <button class="btn btn-warning btn-lg me-3" data-bs-toggle="modal" data-bs-target="#strategyCombinationModal">
                        <i class="fas fa-layer-group me-2"></i>策略组合
                    </button>
                    <button class="btn btn-secondary btn-lg" onclick="showStrategyStatus()">
                        <i class="fas fa-chart-pie me-2"></i>系统状态
                    </button>
                </div>
            </div>

            <!-- 策略列表 -->
            <div class="strategy-card">
                <div class="card-header">
                    <h5><i class="fas fa-list me-2"></i>策略列表</h5>
                </div>
                <div class="card-body">
                    <div id="strategiesList">
                        <p class="text-muted text-center">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 回测结果 -->
            <div class="strategy-card">
                <div class="card-header">
                    <h5><i class="fas fa-chart-bar me-2"></i>回测结果</h5>
                </div>
                <div class="card-body">
                    <div id="backtestResults">
                        <p class="text-muted text-center">暂无回测结果</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 创建策略模态框 -->
    <div class="modal fade" id="createStrategyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建新策略</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createStrategyForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">策略名称</label>
                                    <input type="text" class="form-control" id="strategyName" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">策略类型</label>
                                    <select class="form-select" id="strategyType" required>
                                        <option value="">选择策略类型</option>
                                        <option value="ma_cross">均线交叉</option>
                                        <option value="kdj_macd">KDJ+MACD</option>
                                        <option value="rsi_strategy">RSI策略</option>
                                        <option value="custom">自定义</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">策略描述</label>
                            <textarea class="form-control" id="strategyDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">策略参数 (JSON格式)</label>
                            <textarea class="form-control" id="strategyParameters" rows="4" placeholder='{"param1": "value1", "param2": "value2"}'></textarea>
                            <small class="text-muted">请输入有效的JSON格式参数</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="createStrategy()">创建策略</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 回测模态框 -->
    <div class="modal fade" id="backtestModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">运行策略回测</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="backtestForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">选择策略</label>
                                    <select class="form-select" id="backtestStrategy" required>
                                        <option value="">选择策略</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">股票代码</label>
                                    <input type="text" class="form-control" id="backtestStockCode" placeholder="如: 000001.XSHE" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">开始日期</label>
                                    <input type="date" class="form-control" id="backtestStartDate" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">结束日期</label>
                                    <input type="date" class="form-control" id="backtestEndDate" required>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">初始资金</label>
                            <input type="number" class="form-control" id="backtestCapital" value="100000" min="1000" step="1000" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-success" onclick="runBacktest()">运行回测</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑策略模态框 -->
    <div class="modal fade" id="editStrategyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑策略</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editStrategyForm">
                        <input type="hidden" id="editStrategyId">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="editStrategyName" class="form-label">策略名称</label>
                                    <input type="text" class="form-control" id="editStrategyName" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="editStrategyType" class="form-label">策略类型</label>
                                    <select class="form-select" id="editStrategyType" required>
                                        <option value="trend_following">趋势跟踪</option>
                                        <option value="technical_screening">技术选股</option>
                                        <option value="mean_reversion">均值回归</option>
                                        <option value="momentum">动量策略</option>
                                        <option value="arbitrage">套利策略</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="editStrategyDescription" class="form-label">策略描述</label>
                            <textarea class="form-control" id="editStrategyDescription" rows="3"></textarea>
                        </div>
                        
                        <!-- 策略参数配置 -->
                        <div class="mb-3">
                            <label class="form-label">策略参数</label>
                            <div id="editStrategyParameters">
                                <!-- 参数将通过JavaScript动态生成 -->
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="editStrategyStatus" class="form-label">策略状态</label>
                            <select class="form-select" id="editStrategyStatus" required>
                                <option value="active">激活</option>
                                <option value="inactive">停用</option>
                                <option value="paused">暂停</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveStrategyChanges()">保存更改</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 策略组合模态框 -->
    <div class="modal fade" id="strategyCombinationModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">策略组合管理</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-4">
                            <h6>创建新组合</h6>
                            <form id="combinationForm">
                                <div class="mb-3">
                                    <label class="form-label">组合名称</label>
                                    <input type="text" class="form-control" name="name" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">选择策略</label>
                                    <div id="strategySelection">
                                        <!-- 动态策略选择 -->
                                    </div>
                                </div>
                                <button type="button" class="btn btn-primary" onclick="createCombination()">创建组合</button>
                            </form>
                        </div>
                        <div class="col-md-8">
                            <h6>现有组合</h6>
                            <div id="combinationsList">
                                <!-- 组合列表 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadStrategies();
            loadBacktestResults();
            loadCombinations();
            setupDateDefaults();
        });

        // 设置默认日期
        function setupDateDefaults() {
            const today = new Date();
            const oneMonthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            
            document.getElementById('backtestStartDate').value = oneMonthAgo.toISOString().split('T')[0];
            document.getElementById('backtestEndDate').value = today.toISOString().split('T')[0];
        }

        // 加载策略列表
        async function loadStrategies() {
            try {
                const response = await fetch('/api/v1/strategy/list');
                const data = await response.json();
                
                if (response.ok) {
                    displayStrategies(data.strategies);
                    updateBacktestStrategySelect(data.strategies);
                } else {
                    console.error('获取策略列表失败:', data.detail);
                }
            } catch (error) {
                console.error('加载策略失败:', error);
            }
        }

        // 显示策略列表
        function displayStrategies(strategies) {
            const strategiesList = document.getElementById('strategiesList');
            
            if (strategies.length === 0) {
                strategiesList.innerHTML = '<p class="text-muted text-center">暂无策略</p>';
                return;
            }
            
            const strategiesHtml = strategies.map(strategy => {
                const isActive = (strategy.status === 'active') || (strategy.is_active === true);
                return `
                <div class="strategy-item ${isActive ? 'strategy-active' : 'strategy-inactive'}">
                    <div class="row align-items-center">
                        <div class="col-md-3">
                            <h6 class="mb-1">${strategy.name}</h6>
                            <small class="text-muted">${strategy.type}</small>
                        </div>
                        <div class="col-md-4">
                            <p class="mb-1">${strategy.description}</p>
                            <div class="mb-2">
                                ${Object.entries(strategy.parameters).map(([key, value]) => 
                                    `<span class="parameter-badge">${key}: ${value}</span>`
                                ).join('')}
                            </div>
                        </div>
                        <div class="col-md-2">
                            <span class="badge ${isActive ? 'bg-success' : 'bg-secondary'}">
                                ${isActive ? '激活' : '未激活'}
                            </span>
                        </div>
                        <div class="col-md-3">
                            <div class="btn-group" role="group">
                                <button class="btn btn-sm btn-outline-primary" onclick="editStrategy(${strategy.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-success" onclick="toggleStrategy(${strategy.id}, ${isActive})">
                                    <i class="fas fa-${isActive ? 'pause' : 'play'}"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteStrategy(${strategy.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`
            }).join('');
            
            strategiesList.innerHTML = strategiesHtml;
        }

        // 更新回测策略选择
        function updateBacktestStrategySelect(strategies) {
            const select = document.getElementById('backtestStrategy');
            select.innerHTML = '<option value="">选择策略</option>';
            
            strategies.forEach(strategy => {
                const option = document.createElement('option');
                option.value = strategy.id;
                option.textContent = strategy.name;
                select.appendChild(option);
            });
        }

        // 创建策略
        async function createStrategy() {
            const name = document.getElementById('strategyName').value.trim();
            const type = document.getElementById('strategyType').value;
            const description = document.getElementById('strategyDescription').value.trim();
            const parametersText = document.getElementById('strategyParameters').value.trim();
            
            if (!name || !type || !description) {
                alert('请填写完整信息');
                return;
            }
            
            let parameters = {};
            if (parametersText) {
                try {
                    parameters = JSON.parse(parametersText);
                } catch (e) {
                    alert('策略参数格式错误，请输入有效的JSON');
                    return;
                }
            }
            
            try {
                const params = new URLSearchParams({
                    name: name,
                    strategy_type: type,
                    description: description
                });
                
                // 添加参数
                Object.entries(parameters).forEach(([key, value]) => {
                    params.append(`parameters.${key}`, value);
                });
                
                const response = await fetch(`/api/v1/strategy/create?${params.toString()}`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert('策略创建成功！');
                    document.getElementById('createStrategyForm').reset();
                    bootstrap.Modal.getInstance(document.getElementById('createStrategyModal')).hide();
                    
                    // 刷新策略列表
                    loadStrategies();
                } else {
                    alert(`创建策略失败: ${data.detail}`);
                }
            } catch (error) {
                console.error('创建策略失败:', error);
                alert('创建策略失败，请检查网络连接');
            }
        }

        // 运行回测
        async function runBacktest() {
            const strategyId = document.getElementById('backtestStrategy').value;
            const stockCode = document.getElementById('backtestStockCode').value.trim();
            const startDate = document.getElementById('backtestStartDate').value;
            const endDate = document.getElementById('backtestEndDate').value;
            const capital = parseFloat(document.getElementById('backtestCapital').value);
            
            if (!strategyId || !stockCode || !startDate || !endDate) {
                alert('请填写完整信息');
                return;
            }
            
            try {
                // 使用FormData发送表单数据
                const formData = new FormData();
                formData.append('stock_code', stockCode);
                formData.append('start_date', startDate);
                formData.append('end_date', endDate);
                formData.append('initial_capital', capital);
                
                const response = await fetch(`/api/v1/strategy/${strategyId}/backtest`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert('回测完成！');
                    bootstrap.Modal.getInstance(document.getElementById('backtestModal')).hide();
                    
                    // 刷新回测结果
                    loadBacktestResults();
                } else {
                    alert(`回测失败: ${data.detail}`);
                }
            } catch (error) {
                console.error('运行回测失败:', error);
                alert('运行回测失败，请检查网络连接');
            }
        }

        // 加载回测结果
        async function loadBacktestResults() {
            try {
                // 修复API端点路径
                const response = await fetch('/api/v1/strategy/1/backtest-results');
                const data = await response.json();
                
                if (response.ok) {
                    displayBacktestResults(data.results);
                } else {
                    console.error('获取回测结果失败:', data.detail);
                }
            } catch (error) {
                console.error('加载回测结果失败:', error);
            }
        }

        // 显示回测结果
        function displayBacktestResults(results) {
            const resultsDiv = document.getElementById('backtestResults');
            
            if (results.length === 0) {
                resultsDiv.innerHTML = '<p class="text-muted text-center">暂无回测结果</p>';
                return;
            }
            
            const resultsHtml = results.map(result => {
                const res = result.result;
                return `
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <div class="indicator-card">
                                <h6>总收益率</h6>
                                <h4 class="mb-0">${(res.total_return * 100).toFixed(2)}%</h4>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="indicator-card">
                                <h6>年化收益率</h6>
                                <h4 class="mb-0">${(res.annualized_return * 100).toFixed(2)}%</h4>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="indicator-card">
                                <h6>最大回撤</h6>
                                <h4 class="mb-0">${(res.max_drawdown * 100).toFixed(2)}%</h4>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="indicator-card">
                                <h6>夏普比率</h6>
                                <h4 class="mb-0">${res.sharpe_ratio.toFixed(2)}</h4>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <p><strong>策略ID:</strong> ${result.strategy_id} | 
                               <strong>股票代码:</strong> ${result.stock_code} | 
                               <strong>交易次数:</strong> ${res.trade_count} | 
                               <strong>胜率:</strong> ${(res.win_rate * 100).toFixed(1)}%</p>
                            <p><strong>初始资金:</strong> ${formatCurrency(res.initial_capital)} | 
                               <strong>最终资金:</strong> ${formatCurrency(res.final_capital)} | 
                               <strong>回测日期:</strong> ${formatDate(res.backtest_date)}</p>
                        </div>
                    </div>
                    <hr>
                `;
            }).join('');
            
            resultsDiv.innerHTML = resultsHtml;
        }

        // 编辑策略
        async function editStrategy(strategyId) {
            try {
                // 获取策略详情
                const response = await fetch(`/api/v1/strategy/${strategyId}`);
                const strategy = await response.json();
                
                if (response.ok) {
                    // 填充编辑表单
                    document.getElementById('editStrategyId').value = strategy.id;
                    document.getElementById('editStrategyName').value = strategy.name;
                    document.getElementById('editStrategyType').value = strategy.type;
                    document.getElementById('editStrategyDescription').value = strategy.description;
                    document.getElementById('editStrategyStatus').value = strategy.status;
                    
                    // 生成参数配置界面
                    generateParameterFields(strategy.parameters);
                    
                    // 显示编辑模态框
                    const editModal = new bootstrap.Modal(document.getElementById('editStrategyModal'));
                    editModal.show();
                } else {
                    alert('获取策略详情失败');
                }
            } catch (error) {
                console.error('编辑策略失败:', error);
                alert('编辑策略失败，请检查网络连接');
            }
        }
        
        // 生成参数配置字段
        function generateParameterFields(parameters) {
            const container = document.getElementById('editStrategyParameters');
            container.innerHTML = '';
            
            if (!parameters) return;
            
            Object.entries(parameters).forEach(([key, value]) => {
                const fieldDiv = document.createElement('div');
                fieldDiv.className = 'mb-2';
                
                const label = document.createElement('label');
                label.className = 'form-label';
                label.textContent = key;
                
                let input;
                if (typeof value === 'boolean') {
                    input = document.createElement('select');
                    input.className = 'form-select';
                    input.innerHTML = `
                        <option value="true" ${value ? 'selected' : ''}>是</option>
                        <option value="false" ${!value ? 'selected' : ''}>否</option>
                    `;
                } else if (typeof value === 'number') {
                    input = document.createElement('input');
                    input.type = 'number';
                    input.className = 'form-control';
                    input.value = value;
                    input.step = 'any';
                } else {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'form-control';
                    input.value = value;
                }
                
                input.name = key;
                fieldDiv.appendChild(label);
                fieldDiv.appendChild(input);
                container.appendChild(fieldDiv);
            });
        }
        
        // 保存策略更改
        async function saveStrategyChanges() {
            try {
                const strategyId = document.getElementById('editStrategyId').value;
                
                // 收集表单数据
                const formData = {
                    name: document.getElementById('editStrategyName').value,
                    type: document.getElementById('editStrategyType').value,
                    description: document.getElementById('editStrategyDescription').value,
                    status: document.getElementById('editStrategyStatus').value,
                    parameters: {}
                };
                
                // 收集参数数据
                const parameterInputs = document.getElementById('editStrategyParameters').querySelectorAll('input, select');
                parameterInputs.forEach(input => {
                    let value = input.value;
                    if (input.type === 'number') {
                        value = parseFloat(value);
                    } else if (input.type === 'select-one' && (value === 'true' || value === 'false')) {
                        value = value === 'true';
                    }
                    formData.parameters[input.name] = value;
                });
                
                // 发送更新请求
                const response = await fetch(`/api/v1/strategy/${strategyId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    alert('策略更新成功！');
                    
                    // 关闭模态框
                    const editModal = bootstrap.Modal.getInstance(document.getElementById('editStrategyModal'));
                    editModal.hide();
                    
                    // 刷新策略列表
                    loadStrategies();
                } else {
                    const errorData = await response.json();
                    alert(`更新策略失败: ${errorData.detail}`);
                }
            } catch (error) {
                console.error('保存策略更改失败:', error);
                alert('保存策略更改失败，请检查网络连接');
            }
        }

        // 切换策略状态
        async function toggleStrategy(strategyId, currentStatus) {
            try {
                const response = await fetch(`/api/v1/strategy/${strategyId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: !currentStatus ? 'active' : 'inactive'
                    })
                });
                
                if (response.ok) {
                    loadStrategies();
                } else {
                    alert('切换策略状态失败');
                }
            } catch (error) {
                console.error('切换策略状态失败:', error);
            }
        }

        // 删除策略
        async function deleteStrategy(strategyId) {
            if (!confirm('确定要删除这个策略吗？')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/v1/strategy/${strategyId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    alert('策略删除成功！');
                    loadStrategies();
                } else {
                    alert('删除策略失败');
                }
            } catch (error) {
                console.error('删除策略失败:', error);
            }
        }

        // 刷新策略
        function refreshStrategies() {
            loadStrategies();
        }

        // 显示策略系统状态
        async function showStrategyStatus() {
            try {
                const response = await fetch('/api/v1/strategy/status');
                const data = await response.json();
                
                if (response.ok) {
                    let statusHtml = `
                        <div class="alert alert-info">
                            <h6>策略系统状态</h6>
                            <p><strong>总策略数:</strong> ${data.total_strategies}</p>
                            <p><strong>总组合数:</strong> ${data.total_combinations}</p>
                            <p><strong>服务状态:</strong> <span class="badge bg-success">${data.service_status}</span></p>
                        </div>
                    `;
                    
                    if (data.status_distribution) {
                        statusHtml += '<h6>策略状态分布</h6><ul>';
                        Object.entries(data.status_distribution).forEach(([status, count]) => {
                            statusHtml += `<li>${status}: ${count}</li>`;
                        });
                        statusHtml += '</ul>';
                    }
                    
                    if (data.type_distribution) {
                        statusHtml += '<h6>策略类型分布</h6><ul>';
                        Object.entries(data.type_distribution).forEach(([type, count]) => {
                            statusHtml += `<li>${type}: ${count}</li>`;
                        });
                        statusHtml += '</ul>';
                    }
                    
                    alert(statusHtml.replace(/<[^>]*>/g, ''));
                } else {
                    alert('获取系统状态失败');
                }
            } catch (error) {
                console.error('获取系统状态失败:', error);
                alert('获取系统状态失败');
            }
        }

        // 创建策略组合
        async function createCombination() {
            const name = document.querySelector('#combinationForm input[name="name"]').value.trim();
            const selectedStrategies = Array.from(document.querySelectorAll('#strategySelection input[type="checkbox"]:checked'))
                .map(cb => parseInt(cb.value));
            const allocations = Array.from(document.querySelectorAll('#strategySelection input[type="number"]'))
                .map(input => parseFloat(input.value) / 100);
            
            if (!name || selectedStrategies.length === 0) {
                alert('请填写组合名称并选择策略');
                return;
            }
            
            // 验证分配比例总和为100%
            const totalAllocation = allocations.reduce((sum, alloc) => sum + alloc, 0);
            if (Math.abs(totalAllocation - 1.0) > 0.01) {
                alert('策略分配比例总和必须为100%');
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('name', name);
                formData.append('strategy_ids', JSON.stringify(selectedStrategies));
                formData.append('allocation', JSON.stringify(allocations));
                
                const response = await fetch('/api/v1/strategy/combinations/create', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert('策略组合创建成功！');
                    document.getElementById('combinationForm').reset();
                    loadCombinations();
                } else {
                    alert(`创建组合失败: ${data.detail}`);
                }
            } catch (error) {
                console.error('创建组合失败:', error);
                alert('创建组合失败，请检查网络连接');
            }
        }

        // 加载策略组合
        async function loadCombinations() {
            try {
                const response = await fetch('/api/v1/strategy/combinations/list');
                const data = await response.json();
                
                if (response.ok) {
                    displayCombinations(data.combinations);
                } else {
                    console.error('获取组合列表失败:', data.detail);
                }
            } catch (error) {
                console.error('加载组合失败:', error);
            }
        }

        // 显示策略组合
        function displayCombinations(combinations) {
            const combinationsList = document.getElementById('combinationsList');
            
            if (combinations.length === 0) {
                combinationsList.innerHTML = '<p class="text-muted">暂无策略组合</p>';
                return;
            }
            
            const combinationsHtml = combinations.map(combination => `
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 class="card-title">${combination.name}</h6>
                        <p class="card-text">
                            <strong>策略数量:</strong> ${combination.strategies.length}<br>
                            <strong>状态:</strong> <span class="badge bg-${combination.status === 'active' ? 'success' : 'secondary'}">${combination.status}</span>
                        </p>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-primary" onclick="runCombinationBacktest(${combination.id})">
                                <i class="fas fa-chart-line"></i> 回测
                            </button>
                            <button class="btn btn-outline-danger" onclick="deleteCombination(${combination.id})">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            combinationsList.innerHTML = combinationsHtml;
        }

        // 运行组合回测
        async function runCombinationBacktest(combinationId) {
            const stockCodes = prompt('请输入股票代码列表（用逗号分隔）:').split(',').map(s => s.trim());
            const startDate = prompt('请输入开始日期 (YYYY-MM-DD):');
            const endDate = prompt('请输入结束日期 (YYYY-MM-DD):');
            const capital = parseFloat(prompt('请输入初始资金:') || '100000');
            
            if (!stockCodes.length || !startDate || !endDate) {
                alert('请填写完整信息');
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('stock_codes', JSON.stringify(stockCodes));
                formData.append('start_date', startDate);
                formData.append('end_date', endDate);
                formData.append('initial_capital', capital);
                
                const response = await fetch(`/api/v1/strategy/combinations/${combinationId}/backtest`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert('组合回测完成！');
                    console.log('回测结果:', data);
                } else {
                    alert(`组合回测失败: ${data.detail}`);
                }
            } catch (error) {
                console.error('组合回测失败:', error);
                alert('组合回测失败，请检查网络连接');
            }
        }

        // 删除策略组合
        async function deleteCombination(combinationId) {
            if (!confirm('确定要删除这个策略组合吗？')) {
                return;
            }
            
            alert('删除组合功能开发中...');
        }

        // 工具函数
        function formatCurrency(amount) {
            return new Intl.NumberFormat('zh-CN', {
                style: 'currency',
                currency: 'CNY'
            }).format(amount);
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleString('zh-CN');
        }
    </script>
</body>
