<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能自动交易系统 - 量化交易系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
    <style>
        .trading-card {
            transition: all 0.3s ease;
            border: 2px solid #e9ecef;
        }
        .trading-card:hover {
            border-color: #007bff;
            box-shadow: 0 4px 8px rgba(0,123,255,0.2);
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-active { background-color: #28a745; }
        .status-paused { background-color: #ffc107; }
        .status-stopped { background-color: #dc3545; }
        .signal-item {
            border-left: 4px solid #007bff;
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
        }
        .signal-buy { border-left-color: #28a745; }
        .signal-sell { border-left-color: #dc3545; }
        .signal-hold { border-left-color: #6c757d; }
        .performance-chart {
            height: 300px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-robot me-2"></i>智能自动交易系统
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>主页</a>
                <a class="nav-link" href="/dashboard"><i class="fas fa-chart-line me-1"></i>仪表板</a>
                <a class="nav-link active" href="/auto-trading"><i class="fas fa-robot me-1"></i>自动交易</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 系统状态概览 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i>系统状态概览</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="text-center">
                                    <h4 class="text-success" id="total-strategies">0</h4>
                                    <p class="text-muted">活跃策略</p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="text-center">
                                    <h4 class="text-info" id="total-signals">0</h4>
                                    <p class="text-muted">待执行信号</p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="text-center">
                                    <h4 class="text-warning" id="total-trades">0</h4>
                                    <p class="text-muted">今日交易</p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="text-center">
                                    <h4 class="text-primary" id="total-pnl">¥0.00</h4>
                                    <p class="text-muted">今日盈亏</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 银河证券连接状态 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-university me-2"></i>银河证券连接状态</h5>
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <div class="d-flex align-items-center mb-3">
                                    <span class="status-indicator status-active" id="broker-status"></span>
                                    <span class="fw-bold" id="broker-status-text">已连接</span>
                                </div>
                                <p class="text-muted mb-2">账户: <span id="broker-account">******</span></p>
                                <p class="text-muted mb-2">服务器: <span id="broker-server">api.galaxy.com.cn</span></p>
                                <p class="text-muted mb-0">连接时间: <span id="broker-connect-time">2025-08-18 20:55:00</span></p>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-success" id="btn-connect">
                                        <i class="fas fa-plug me-1"></i>连接
                                    </button>
                                    <button class="btn btn-outline-danger" id="btn-disconnect">
                                        <i class="fas fa-times me-1"></i>断开
                                    </button>
                                    <button class="btn btn-outline-info" id="btn-refresh">
                                        <i class="fas fa-sync me-1"></i>刷新
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 策略执行控制 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card trading-card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-play-circle me-2"></i>策略执行控制</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">选择策略</label>
                            <select class="form-select" id="strategy-select">
                                <option value="">请选择策略</option>
                                <option value="ma_cross">均线交叉策略</option>
                                <option value="kdj_macd">KDJ+MACD策略</option>
                                <option value="rsi">RSI策略</option>
                                <option value="bollinger">布林带策略</option>
                                <option value="volume">成交量策略</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">执行模式</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="execution-mode" id="mode-auto" value="auto" checked>
                                <label class="form-check-label" for="mode-auto">自动执行</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="execution-mode" id="mode-manual" value="manual">
                                <label class="form-check-label" for="mode-manual">手动确认</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="execution-mode" id="mode-paper" value="paper">
                                <label class="form-check-label" for="mode-paper">模拟交易</label>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-success" id="btn-start-strategy">
                                <i class="fas fa-play me-1"></i>启动策略
                            </button>
                            <button class="btn btn-warning" id="btn-pause-strategy">
                                <i class="fas fa-pause me-1"></i>暂停策略
                            </button>
                            <button class="btn btn-danger" id="btn-stop-strategy">
                                <i class="fas fa-stop me-1"></i>停止策略
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card trading-card">
                    <div class="card-header bg-warning text-white">
                        <h5 class="mb-0"><i class="fas fa-shield-alt me-2"></i>风险控制设置</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">最大仓位比例</label>
                            <input type="range" class="form-range" id="max-position" min="0.1" max="1.0" step="0.05" value="0.95">
                            <div class="d-flex justify-content-between">
                                <small>10%</small>
                                <small id="max-position-value">95%</small>
                                <small>100%</small>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">止损比例</label>
                            <input type="range" class="form-range" id="stop-loss" min="0.01" max="0.20" step="0.01" value="0.05">
                            <div class="d-flex justify-content-between">
                                <small>1%</small>
                                <small id="stop-loss-value">5%</small>
                                <small>20%</small>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">止盈比例</label>
                            <input type="range" class="form-range" id="take-profit" min="0.05" max="0.50" step="0.05" value="0.15">
                            <div class="d-flex justify-content-between">
                                <small>5%</small>
                                <small id="take-profit-value">15%</small>
                                <small>50%</small>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">最大日交易次数</label>
                            <input type="number" class="form-control" id="max-daily-trades" min="1" max="100" value="10">
                        </div>
                        <button class="btn btn-primary w-100" id="btn-save-risk-settings">
                            <i class="fas fa-save me-1"></i>保存设置
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 实时信号和执行状态 -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-signal me-2"></i>实时交易信号</h5>
                    </div>
                    <div class="card-body">
                        <div id="signals-container">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-signal fa-3x mb-3"></i>
                                <p>暂无交易信号</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-chart-line me-2"></i>执行状态</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <h6>策略状态</h6>
                            <div id="strategy-status-list">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span>均线交叉策略</span>
                                    <span class="badge bg-success">运行中</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span>KDJ+MACD策略</span>
                                    <span class="badge bg-warning">暂停</span>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <h6>执行统计</h6>
                            <div class="row text-center">
                                <div class="col-6">
                                    <h5 class="text-success" id="success-trades">0</h5>
                                    <small class="text-muted">成功</small>
                                </div>
                                <div class="col-6">
                                    <h5 class="text-danger" id="failed-trades">0</h5>
                                    <small class="text-muted">失败</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 交易历史和绩效分析 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-history me-2"></i>今日交易历史</h5>
                    </div>
                    <div class="card-body">
                        <div id="trades-container">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-history fa-3x mb-3"></i>
                                <p>暂无交易记录</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-warning text-white">
                        <h5 class="mb-0"><i class="fas fa-chart-bar me-2"></i>绩效分析</h5>
                    </div>
                    <div class="card-body">
                        <div class="performance-chart">
                            <div class="text-center">
                                <i class="fas fa-chart-bar fa-3x mb-3"></i>
                                <p>绩效图表加载中...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeAutoTrading();
        });

        function initializeAutoTrading() {
            // 初始化风险控制滑块
            initializeRiskControls();
            
            // 绑定按钮事件
            bindButtonEvents();
            
            // 加载初始数据
            loadInitialData();
            
            // 启动实时更新
            startRealTimeUpdates();
        }

        function initializeRiskControls() {
            // 最大仓位比例
            const maxPosition = document.getElementById('max-position');
            const maxPositionValue = document.getElementById('max-position-value');
            maxPosition.addEventListener('input', function() {
                maxPositionValue.textContent = Math.round(this.value * 100) + '%';
            });

            // 止损比例
            const stopLoss = document.getElementById('stop-loss');
            const stopLossValue = document.getElementById('stop-loss-value');
            stopLoss.addEventListener('input', function() {
                stopLossValue.textContent = Math.round(this.value * 100) + '%';
            });

            // 止盈比例
            const takeProfit = document.getElementById('take-profit');
            const takeProfitValue = document.getElementById('take-profit-value');
            takeProfit.addEventListener('input', function() {
                takeProfitValue.textContent = Math.round(this.value * 100) + '%';
            });
        }

        function bindButtonEvents() {
            // 连接按钮
            document.getElementById('btn-connect').addEventListener('click', function() {
                connectBroker();
            });

            // 断开按钮
            document.getElementById('btn-disconnect').addEventListener('click', function() {
                disconnectBroker();
            });

            // 刷新按钮
            document.getElementById('btn-refresh').addEventListener('click', function() {
                refreshStatus();
            });

            // 启动策略按钮
            document.getElementById('btn-start-strategy').addEventListener('click', function() {
                startStrategy();
            });

            // 暂停策略按钮
            document.getElementById('btn-pause-strategy').addEventListener('click', function() {
                pauseStrategy();
            });

            // 停止策略按钮
            document.getElementById('btn-stop-strategy').addEventListener('click', function() {
                stopStrategy();
            });

            // 保存风险设置按钮
            document.getElementById('btn-save-risk-settings').addEventListener('click', function() {
                saveRiskSettings();
            });
        }

        function connectBroker() {
            // 模拟连接过程
            const btn = document.getElementById('btn-connect');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>连接中...';
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalText;
                
                // 更新状态
                document.getElementById('broker-status').className = 'status-indicator status-active';
                document.getElementById('broker-status-text').textContent = '已连接';
                document.getElementById('broker-connect-time').textContent = new Date().toLocaleString();
                
                showAlert('银河证券连接成功！', 'success');
            }, 2000);
        }

        function disconnectBroker() {
            document.getElementById('broker-status').className = 'status-indicator status-stopped';
            document.getElementById('broker-status-text').textContent = '已断开';
            showAlert('银河证券已断开连接', 'info');
        }

        function refreshStatus() {
            // 模拟刷新数据
            loadInitialData();
            showAlert('状态已刷新', 'info');
        }

        function startStrategy() {
            const strategySelect = document.getElementById('strategy-select');
            const executionMode = document.querySelector('input[name="execution-mode"]:checked').value;
            
            if (!strategySelect.value) {
                showAlert('请先选择策略', 'warning');
                return;
            }
            
            // 模拟启动策略
            showAlert(`策略 ${strategySelect.value} 启动成功！执行模式: ${executionMode}`, 'success');
            
            // 更新策略状态
            updateStrategyStatus(strategySelect.value, '运行中');
        }

        function pauseStrategy() {
            const strategySelect = document.getElementById('strategy-select');
            if (!strategySelect.value) {
                showAlert('请先选择策略', 'warning');
                return;
            }
            
            showAlert(`策略 ${strategySelect.value} 已暂停`, 'warning');
            updateStrategyStatus(strategySelect.value, '暂停');
        }

        function stopStrategy() {
            const strategySelect = document.getElementById('strategy-select');
            if (!strategySelect.value) {
                showAlert('请先选择策略', 'warning');
                return;
            }
            
            showAlert(`策略 ${strategySelect.value} 已停止`, 'info');
            updateStrategyStatus(strategySelect.value, '停止');
        }

        function saveRiskSettings() {
            const maxPosition = document.getElementById('max-position').value;
            const stopLoss = document.getElementById('stop-loss').value;
            const takeProfit = document.getElementById('take-profit').value;
            const maxDailyTrades = document.getElementById('max-daily-trades').value;
            
            // 模拟保存设置
            setTimeout(() => {
                showAlert('风险控制设置已保存', 'success');
            }, 1000);
        }

        function updateStrategyStatus(strategyName, status) {
            // 更新策略状态显示
            const statusList = document.getElementById('strategy-status-list');
            // 这里可以添加具体的状态更新逻辑
        }

        function loadInitialData() {
            // 模拟加载初始数据
            document.getElementById('total-strategies').textContent = '3';
            document.getElementById('total-signals').textContent = '5';
            document.getElementById('total-trades').textContent = '12';
            document.getElementById('total-pnl').textContent = '¥1,234.56';
            
            // 模拟加载交易信号
            loadSampleSignals();
            
            // 模拟加载交易历史
            loadSampleTrades();
        }

        function loadSampleSignals() {
            const signalsContainer = document.getElementById('signals-container');
            const sampleSignals = [
                { stock: '000001.XSHE', action: 'buy', price: 12.50, quantity: 1000, confidence: 0.85, time: '20:54:30' },
                { stock: '000002.XSHE', action: 'sell', price: 18.20, quantity: 500, confidence: 0.78, time: '20:53:15' },
                { stock: '000858.XSHE', action: 'hold', price: 0, quantity: 0, confidence: 0.65, time: '20:52:45' }
            ];
            
            let signalsHTML = '';
            sampleSignals.forEach(signal => {
                const actionClass = signal.action === 'buy' ? 'signal-buy' : 
                                  signal.action === 'sell' ? 'signal-sell' : 'signal-hold';
                const actionIcon = signal.action === 'buy' ? 'fa-arrow-up' : 
                                 signal.action === 'sell' ? 'fa-arrow-down' : 'fa-minus';
                const actionColor = signal.action === 'buy' ? 'text-success' : 
                                  signal.action === 'sell' ? 'text-danger' : 'text-muted';
                
                signalsHTML += `
                    <div class="signal-item ${actionClass}">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${signal.stock}</strong>
                                <span class="badge ${actionColor} ms-2">
                                    <i class="fas ${actionIcon} me-1"></i>${signal.action.toUpperCase()}
                                </span>
                            </div>
                            <small class="text-muted">${signal.time}</small>
                        </div>
                        <div class="mt-2">
                            <span class="text-muted">数量: ${signal.quantity}</span>
                            ${signal.price > 0 ? `<span class="text-muted ms-3">价格: ¥${signal.price}</span>` : ''}
                            <span class="text-muted ms-3">置信度: ${Math.round(signal.confidence * 100)}%</span>
                        </div>
                    </div>
                `;
            });
            
            signalsContainer.innerHTML = signalsHTML;
        }

        function loadSampleTrades() {
            const tradesContainer = document.getElementById('trades-container');
            const sampleTrades = [
                { stock: '000001.XSHE', action: 'buy', price: 12.45, quantity: 1000, time: '20:50:15', status: 'success' },
                { stock: '000002.XSHE', action: 'sell', price: 18.15, quantity: 500, time: '20:45:30', status: 'success' },
                { stock: '000858.XSHE', action: 'buy', price: 156.80, quantity: 100, time: '20:40:22', status: 'success' }
            ];
            
            let tradesHTML = '';
            sampleTrades.forEach(trade => {
                const actionColor = trade.action === 'buy' ? 'text-success' : 'text-danger';
                const actionIcon = trade.action === 'buy' ? 'fa-arrow-up' : 'fa-arrow-down';
                
                tradesHTML += `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <strong>${trade.stock}</strong>
                            <span class="badge ${actionColor} ms-2">
                                <i class="fas ${actionIcon} me-1"></i>${trade.action.toUpperCase()}
                            </span>
                        </div>
                        <div class="text-end">
                            <div>¥${trade.price} × ${trade.quantity}</div>
                            <small class="text-muted">${trade.time}</small>
                        </div>
                    </div>
                `;
            });
            
            tradesContainer.innerHTML = tradesHTML;
        }

        function startRealTimeUpdates() {
            // 模拟实时数据更新
            setInterval(() => {
                // 更新信号数量
                const currentSignals = parseInt(document.getElementById('total-signals').textContent);
                if (Math.random() > 0.7) {
                    document.getElementById('total-signals').textContent = currentSignals + 1;
                }
                
                // 更新交易数量
                const currentTrades = parseInt(document.getElementById('total-trades').textContent);
                if (Math.random() > 0.8) {
                    document.getElementById('total-trades').textContent = currentTrades + 1;
                }
            }, 5000);
        }

        function showAlert(message, type) {
            // 创建提示框
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(alertDiv);
            
            // 3秒后自动消失
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 3000);
        }
    </script>
