<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聚宽演示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>聚宽数据服务演示</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">连接状态</div>
                    <div class="card-body">
                        <div id="status">检查中...</div>
                        <button class="btn btn-primary mt-2" onclick="checkStatus()">检查状态</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">股票列表测试</div>
                    <div class="card-body">
                        <button class="btn btn-success" onclick="testStocks()">获取A股列表</button>
                        <div id="stocks" class="mt-2">点击按钮测试</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function checkStatus() {
            try {
                const response = await fetch('/api/v1/jq/status');
                const data = await response.json();
                document.getElementById('status').innerHTML = `
                    <p>服务: ${data.service}</p>
                    <p>连接: ${data.status.is_connected ? '是' : '否'}</p>
                    <p>状态: ${data.status.status}</p>
                `;
            } catch (error) {
                document.getElementById('status').innerHTML = '检查失败: ' + error.message;
            }
        }

        async function testStocks() {
            try {
                const response = await fetch('/api/v1/jq/stocks?market=CN');
                const data = await response.json();
                document.getElementById('stocks').innerHTML = `
                    <p>市场: ${data.market}</p>
                    <p>数量: ${data.count}</p>
                    <p>前5只: ${data.stocks.slice(0, 5).join(', ')}</p>
                `;
            } catch (error) {
                document.getElementById('stocks').innerHTML = '测试失败: ' + error.message;
            }
        }

        // 页面加载时检查状态
        checkStatus();
    </script>
</body>
</html>
