<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聚宽数据演示 - 量化交易系统 v2.0.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .jq-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
        }
        .status-card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .status-online { border-left: 5px solid #28a745; }
        .status-offline { border-left: 5px solid #dc3545; }
        .status-unknown { border-left: 5px solid #ffc107; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-arrow-left me-2"></i>
                返回主页
            </a>
            <span class="navbar-text">
                聚宽数据演示
            </span>
        </div>
    </nav>

    <!-- 头部 -->
    <section class="jq-header">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-3">
                <i class="fas fa-database me-3"></i>
                聚宽数据服务演示
            </h1>
            <p class="lead">测试聚宽数据接口和连接状态</p>
        </div>
    </section>

    <!-- 主要内容 -->
    <section class="py-5">
        <div class="container">
            <!-- 连接状态 -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card status-card" id="connectionCard">
                        <div class="card-header">
                            <h5><i class="fas fa-plug me-2"></i>连接状态</h5>
                        </div>
                        <div class="card-body">
                            <div id="connectionStatus">
                                <p>检查中...</p>
                            </div>
                            <div class="mt-3">
                                <button class="btn btn-success me-2" onclick="connectJQ()">
                                    <i class="fas fa-link me-2"></i>连接
                                </button>
                                <button class="btn btn-danger" onclick="disconnectJQ()">
                                    <i class="fas fa-unlink me-2"></i>断开
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card status-card">
                        <div class="card-header">
                            <h5><i class="fas fa-info-circle me-2"></i>服务信息</h5>
                        </div>
                        <div class="card-body">
                            <div id="serviceInfo">
                                <p>加载中...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 数据测试 -->
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-list me-2"></i>股票列表测试</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">选择市场:</label>
                                <select class="form-select" id="marketSelect">
                                    <option value="CN">A股市场 (CN)</option>
                                    <option value="HK">港股市场 (HK)</option>
                                    <option value="US">美股市场 (US)</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" onclick="testStockList()">
                                <i class="fas fa-download me-2"></i>获取股票列表
                            </button>
                            <div id="stockListResult" class="mt-3">
                                <p class="text-muted">点击按钮测试股票列表接口</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-search me-2"></i>股票数据测试</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">股票代码:</label>
                                <input type="text" class="form-control" id="stockCodeInput" 
                                       placeholder="如: 000001.XSHE" value="000001.XSHE">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">开始日期:</label>
                                <input type="date" class="form-control" id="startDateInput">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">结束日期:</label>
                                <input type="date" class="form-control" id="endDateInput">
                            </div>
                            <button class="btn btn-info" onclick="testStockData()">
                                <i class="fas fa-search me-2"></i>查询数据
                            </button>
                            <div id="stockDataResult" class="mt-3">
                                <p class="text-muted">输入股票代码和日期范围测试数据接口</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 实时行情测试 -->
            <div class="row mt-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-chart-line me-2"></i>实时行情测试</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">股票代码列表 (用逗号分隔):</label>
                                <input type="text" class="form-control" id="quotesInput" 
                                       placeholder="如: 000001.XSHE,000002.XSHE,600000.XSHG" 
                                       value="000001.XSHE,000002.XSHE">
                            </div>
                            <button class="btn btn-warning" onclick="testRealtimeQuotes()">
                                <i class="fas fa-bolt me-2"></i>获取实时行情
                            </button>
                            <div id="quotesResult" class="mt-3">
                                <p class="text-muted">输入股票代码列表测试实时行情接口</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 错误日志 -->
            <div class="row mt-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-exclamation-triangle me-2"></i>错误日志</h5>
                        </div>
                        <div class="card-body">
                            <div id="errorLog" class="bg-light p-3 rounded" style="max-height: 200px; overflow-y: auto;">
                                <p class="text-muted">错误信息将显示在这里</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期
            const today = new Date();
            const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, today.getDate());
            
            document.getElementById('startDateInput').value = lastMonth.toISOString().split('T')[0];
            document.getElementById('endDateInput').value = today.toISOString().split('T')[0];
            
            // 加载初始状态
            loadConnectionStatus();
            loadServiceInfo();
        });

        // 加载连接状态
        async function loadConnectionStatus() {
            try {
                const response = await fetch('/api/v1/jq/status');
                const data = await response.json();
                
                const status = data.status;
                const statusHtml = `
                    <div class="d-flex align-items-center mb-2">
                        <span class="badge ${status.is_connected ? 'bg-success' : 'bg-danger'} me-2">
                            ${status.is_connected ? '已连接' : '未连接'}
                        </span>
                        <span class="fw-bold">${status.status}</span>
                    </div>
                    <p class="mb-1"><strong>用户名:</strong> ${status.username || '未配置'}</p>
                    <p class="mb-1"><strong>最后检查:</strong> ${new Date(status.last_check).toLocaleString()}</p>
                    ${status.error ? `<p class="mb-0 text-danger"><strong>错误:</strong> ${status.error}</p>` : ''}
                `;
                
                document.getElementById('connectionStatus').innerHTML = statusHtml;
                
                // 更新卡片样式
                const card = document.getElementById('connectionCard');
                card.className = card.className.replace(/status-\w+/g, '');
                if (status.is_connected) {
                    card.classList.add('status-online');
                } else if (status.status === 'failed') {
                    card.classList.add('status-offline');
                } else {
                    card.classList.add('status-unknown');
                }
            } catch (error) {
                console.error('加载连接状态失败:', error);
                logError('加载连接状态失败: ' + error.message);
            }
        }

        // 加载服务信息
        async function loadServiceInfo() {
            try {
                const response = await fetch('/api/v1/jq/health');
                const data = await response.json();
                
                const infoHtml = `
                    <p class="mb-1"><strong>服务名称:</strong> ${data.service}</p>
                    <p class="mb-1"><strong>状态:</strong> 
                        <span class="badge ${data.status === 'healthy' ? 'bg-success' : 'bg-danger'}">
                            ${data.status}
                        </span>
                    </p>
                    <p class="mb-1"><strong>连接状态:</strong> ${data.connection_status || '未知'}</p>
                    <p class="mb-0"><strong>最后检查:</strong> ${new Date(data.last_check).toLocaleString()}</p>
                    ${data.error ? `<p class="mt-2 text-danger"><strong>错误:</strong> ${data.error}</p>` : ''}
                `;
                
                document.getElementById('serviceInfo').innerHTML = infoHtml;
            } catch (error) {
                console.error('加载服务信息失败:', error);
                logError('加载服务信息失败: ' + error.message);
            }
        }

        // 连接聚宽
        async function connectJQ() {
            try {
                const response = await fetch('/api/v1/jq/connect', { method: 'POST' });
                const data = await response.json();
                
                if (response.ok) {
                    alert('聚宽连接成功！');
                    loadConnectionStatus();
                    loadServiceInfo();
                } else {
                    alert(`连接失败: ${data.detail}`);
                    logError(`连接失败: ${data.detail}`);
                }
            } catch (error) {
                console.error('连接聚宽失败:', error);
                alert('连接失败，请检查网络连接');
                logError('连接失败: ' + error.message);
            }
        }

        // 断开聚宽
        async function disconnectJQ() {
            try {
                const response = await fetch('/api/v1/jq/disconnect', { method: 'POST' });
                const data = await response.json();
                
                if (response.ok) {
                    alert('聚宽连接已断开');
                    loadConnectionStatus();
                    loadServiceInfo();
                } else {
                    alert(`断开失败: ${data.detail}`);
                    logError(`断开失败: ${data.detail}`);
                }
            } catch (error) {
                console.error('断开聚宽失败:', error);
                alert('断开失败，请检查网络连接');
                logError('断开失败: ' + error.message);
            }
        }

        // 测试股票列表
        async function testStockList() {
            const market = document.getElementById('marketSelect').value;
            
            try {
                document.getElementById('stockListResult').innerHTML = '<p>加载中...</p>';
                
                const response = await fetch(`/api/v1/jq/stocks?market=${market}`);
                const data = await response.json();
                
                if (response.ok) {
                    const stocksHtml = data.stocks.map(stock => 
                        `<span class="badge bg-primary me-1 mb-1">${stock}</span>`
                    ).join('');
                    
                    document.getElementById('stockListResult').innerHTML = `
                        <p><strong>市场:</strong> ${data.market}</p>
                        <p><strong>总数:</strong> ${data.count.toLocaleString()}</p>
                        <p><strong>前100只:</strong></p>
                        <div>${stocksHtml}</div>
                    `;
                } else {
                    document.getElementById('stockListResult').innerHTML = `<p class="text-danger">获取失败: ${data.detail}</p>`;
                    logError(`获取股票列表失败: ${data.detail}`);
                }
            } catch (error) {
                console.error('测试股票列表失败:', error);
                document.getElementById('stockListResult').innerHTML = '<p class="text-danger">测试失败，请检查网络连接</p>';
                logError('测试股票列表失败: ' + error.message);
            }
        }

        // 测试股票数据
        async function testStockData() {
            const stockCode = document.getElementById('stockCodeInput').value.trim();
            const startDate = document.getElementById('startDateInput').value;
            const endDate = document.getElementById('endDateInput').value;
            
            if (!stockCode) {
                alert('请输入股票代码');
                return;
            }
            
            if (!startDate || !endDate) {
                alert('请选择日期范围');
                return;
            }
            
            try {
                document.getElementById('stockDataResult').innerHTML = '<p>查询中...</p>';
                
                const response = await fetch(`/api/v1/jq/daily-data/${stockCode}?start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();
                
                if (response.ok) {
                    if (data.count > 0) {
                        const dataHtml = data.data.map(item => `
                            <div class="border-bottom p-2">
                                <strong>${item.date || '未知日期'}</strong><br>
                                <small>开盘: ${item.open} | 最高: ${item.high} | 最低: ${item.low} | 收盘: ${item.close} | 成交量: ${item.volume}</small>
                            </div>
                        `).join('');
                        
                        document.getElementById('stockDataResult').innerHTML = `
                            <p><strong>股票代码:</strong> ${data.stock_code}</p>
                            <p><strong>数据条数:</strong> ${data.count}</p>
                            <p><strong>日期范围:</strong> ${data.start_date} 至 ${data.end_date}</p>
                            <div class="mt-2" style="max-height: 300px; overflow-y: auto;">
                                ${dataHtml}
                            </div>
                        `;
                    } else {
                        document.getElementById('stockDataResult').innerHTML = '<p class="text-muted">该日期范围内无数据</p>';
                    }
                } else {
                    document.getElementById('stockDataResult').innerHTML = `<p class="text-danger">查询失败: ${data.detail}</p>`;
                    logError(`查询股票数据失败: ${data.detail}`);
                }
            } catch (error) {
                console.error('测试股票数据失败:', error);
                document.getElementById('stockDataResult').innerHTML = '<p class="text-danger">查询失败，请检查网络连接</p>';
                logError('测试股票数据失败: ' + error.message);
            }
        }

        // 测试实时行情
        async function testRealtimeQuotes() {
            const stockCodes = document.getElementById('quotesInput').value.trim();
            
            if (!stockCodes) {
                alert('请输入股票代码列表');
                return;
            }
            
            try {
                document.getElementById('quotesResult').innerHTML = '<p>获取中...</p>';
                
                const response = await fetch(`/api/v1/jq/realtime-quotes?stock_codes=${encodeURIComponent(stockCodes)}`);
                const data = await response.json();
                
                if (response.ok) {
                    if (data.count > 0) {
                        const quotesHtml = Object.values(data.quotes).map(quote => `
                            <div class="border-bottom p-2">
                                <strong>${quote.code} (${quote.name})</strong><br>
                                <small>价格: ¥${quote.price} | 涨跌: ${quote.change > 0 ? '+' : ''}${quote.change.toFixed(2)} (${quote.change_pct.toFixed(2)}%) | 成交量: ${quote.volume}</small>
                            </div>
                        `).join('');
                        
                        document.getElementById('quotesResult').innerHTML = `
                            <p><strong>时间戳:</strong> ${new Date(data.timestamp).toLocaleString()}</p>
                            <p><strong>股票数量:</strong> ${data.count}</p>
                            <div class="mt-2" style="max-height: 300px; overflow-y: auto;">
                                ${quotesHtml}
                            </div>
                        `;
                    } else {
                        document.getElementById('quotesResult').innerHTML = '<p class="text-muted">无实时行情数据</p>';
                    }
                } else {
                    document.getElementById('quotesResult').innerHTML = `<p class="text-danger">获取失败: ${data.detail}</p>`;
                    logError(`获取实时行情失败: ${data.detail}`);
                }
            } catch (error) {
                console.error('测试实时行情失败:', error);
                document.getElementById('quotesResult').innerHTML = '<p class="text-danger">获取失败，请检查网络连接</p>';
                logError('测试实时行情失败: ' + error.message);
            }
        }

        // 记录错误日志
        function logError(message) {
            const errorLog = document.getElementById('errorLog');
            const timestamp = new Date().toLocaleString();
            const errorEntry = `<div class="text-danger mb-2"><strong>${timestamp}:</strong> ${message}</div>`;
            
            errorLog.innerHTML = errorEntry + errorLog.innerHTML;
        }
    </script>
</body>
</html>
