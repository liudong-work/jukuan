<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时数据 - 量化交易系统 v2.0.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-chart-line me-2"></i>
                量化交易系统 v2.0.0
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">实时监控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/jq-demo">聚宽数据</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stock-table">股票表格</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/trading">交易管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/strategy">策略管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analysis">分析</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/realtime-data">实时数据</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/docs">API文档</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Left Navigation -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-bolt me-2"></i>实时数据功能</h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group">
                            <a href="#realtime-quotes" class="list-group-item list-group-item-action active" data-bs-toggle="list">
                                <i class="fas fa-chart-line me-2"></i>实时行情
                            </a>
                            <a href="#tick-data" class="list-group-item list-group-item-action" data-bs-toggle="list">
                                <i class="fas fa-list me-2"></i>逐笔成交
                            </a>
                            <a href="#market-overview" class="list-group-item list-group-item-action" data-bs-toggle="list">
                                <i class="fas fa-globe me-2"></i>市场概览
                            </a>
                            <a href="#data-quality" class="list-group-item list-group-item-action" data-bs-toggle="list">
                                <i class="fas fa-shield-alt me-2"></i>数据质量
                            </a>
                            <a href="#performance" class="list-group-item list-group-item-action" data-bs-toggle="list">
                                <i class="fas fa-tachometer-alt me-2"></i>性能监控
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 实时数据订阅 -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h6><i class="fas fa-bell me-2"></i>数据订阅</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="subscribeCodes" class="form-label">股票代码</label>
                            <input type="text" class="form-control" id="subscribeCodes" 
                                   placeholder="000001,000002,600036" value="000001,000002,600036">
                            <div class="form-text">多个代码用逗号分隔</div>
                        </div>
                        <div class="mb-3">
                            <label for="dataSource" class="form-label">数据源</label>
                            <select class="form-select" id="dataSource">
                                <option value="jq">聚宽数据</option>
                                <option value="tushare">Tushare</option>
                                <option value="akshare">AKShare</option>
                            </select>
                        </div>
                        <button class="btn btn-primary btn-sm w-100" onclick="subscribeData()">
                            <i class="fas fa-play me-1"></i>开始订阅
                        </button>
                        <button class="btn btn-secondary btn-sm w-100 mt-2" onclick="unsubscribeData()">
                            <i class="fas fa-stop me-1"></i>停止订阅
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Content -->
            <div class="col-md-9">
                <div class="tab-content">
                    <!-- 实时行情 -->
                    <div class="tab-pane fade show active" id="realtime-quotes">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5><i class="fas fa-chart-line me-2"></i>实时行情</h5>
                                <div>
                                    <button class="btn btn-success btn-sm" onclick="refreshQuotes()">
                                        <i class="fas fa-sync-alt me-1"></i>刷新
                                    </button>
                                    <button class="btn btn-info btn-sm ms-2" onclick="autoRefresh()">
                                        <i class="fas fa-play me-1"></i>自动刷新
                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th>代码</th>
                                                <th>名称</th>
                                                <th>最新价</th>
                                                <th>涨跌幅</th>
                                                <th>成交量</th>
                                                <th>成交额</th>
                                                <th>买一价</th>
                                                <th>卖一价</th>
                                                <th>延迟</th>
                                                <th>更新时间</th>
                                            </tr>
                                        </thead>
                                        <tbody id="quotesTableBody">
                                            <!-- 实时行情数据将在这里显示 -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 逐笔成交 -->
                    <div class="tab-pane fade" id="tick-data">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-list me-2"></i>逐笔成交</h5>
                            </div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label for="tickCode" class="form-label">股票代码</label>
                                        <input type="text" class="form-control" id="tickCode" value="000001">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="startTime" class="form-label">开始时间</label>
                                        <input type="datetime-local" class="form-control" id="startTime">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="endTime" class="form-label">结束时间</label>
                                        <input type="datetime-local" class="form-control" id="endTime">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">&nbsp;</label>
                                        <button class="btn btn-primary w-100" onclick="getTickData()">
                                            <i class="fas fa-search me-1"></i>查询
                                        </button>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th>时间</th>
                                                <th>价格</th>
                                                <th>成交量</th>
                                                <th>成交额</th>
                                                <th>方向</th>
                                                <th>序号</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tickTableBody">
                                            <!-- 逐笔成交数据将在这里显示 -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 市场概览 -->
                    <div class="tab-pane fade" id="market-overview">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-globe me-2"></i>市场概览</h5>
                            </div>
                            <div class="card-body">
                                <div class="row" id="marketOverview">
                                    <!-- 市场概览数据将在这里显示 -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 数据质量 -->
                    <div class="tab-pane fade" id="data-quality">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-shield-alt me-2"></i>数据质量监控</h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <canvas id="qualityChart"></canvas>
                                    </div>
                                    <div class="col-md-6">
                                        <div id="qualityAlerts">
                                            <!-- 质量告警将在这里显示 -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 性能监控 -->
                    <div class="tab-pane fade" id="performance">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-tachometer-alt me-2"></i>性能监控</h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <canvas id="performanceChart"></canvas>
                                    </div>
                                    <div class="col-md-6">
                                        <div id="performanceMetrics">
                                            <!-- 性能指标将在这里显示 -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Custom Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        let autoRefreshInterval = null;
        let currentSubscriptionId = null;
        let qualityChart = null;
        let performanceChart = null;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializePage();
            setDefaultTimes();
        });

        // 初始化页面
        function initializePage() {
            // 加载初始数据
            loadRealtimeQuotes();
            loadMarketOverview();
            loadDataQuality();
            loadPerformanceMetrics();
        }

        // 设置默认时间
        function setDefaultTimes() {
            const now = new Date();
            const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
            
            document.getElementById('startTime').value = oneHourAgo.toISOString().slice(0, 16);
            document.getElementById('endTime').value = now.toISOString().slice(0, 16);
        }

        // 加载实时行情
        async function loadRealtimeQuotes() {
            try {
                const codes = document.getElementById('subscribeCodes').value;
                const response = await fetch(`/api/v1/realtime/quotes?codes=${codes}&source=jq`);
                const result = await response.json();
                
                if (result.success) {
                    displayQuotes(result.data.quotes);
                } else {
                    console.error('加载实时行情失败:', result.message);
                }
            } catch (error) {
                console.error('加载实时行情失败:', error);
            }
        }

        // 显示实时行情
        function displayQuotes(quotes) {
            const tbody = document.getElementById('quotesTableBody');
            tbody.innerHTML = '';
            
            quotes.forEach(quote => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${quote.code}</strong></td>
                    <td>${quote.name}</td>
                    <td class="text-primary fw-bold">${quote.price.toFixed(2)}</td>
                    <td class="text-success">+2.1%</td>
                    <td>${(quote.volume / 10000).toFixed(0)}万</td>
                    <td>${(quote.amount / 100000000).toFixed(2)}亿</td>
                    <td class="text-danger">${quote.bid_price.toFixed(2)}</td>
                    <td class="text-success">${quote.ask_price.toFixed(2)}</td>
                    <td>${quote.latency_ms.toFixed(0)}ms</td>
                    <td>${new Date(quote.timestamp).toLocaleTimeString()}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // 刷新行情
        function refreshQuotes() {
            loadRealtimeQuotes();
        }

        // 自动刷新
        function autoRefresh() {
            const button = event.target;
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                button.innerHTML = '<i class="fas fa-play me-1"></i>自动刷新';
                button.classList.remove('btn-warning');
                button.classList.add('btn-info');
            } else {
                autoRefreshInterval = setInterval(loadRealtimeQuotes, 5000); // 5秒刷新一次
                button.innerHTML = '<i class="fas fa-pause me-1"></i>停止刷新';
                button.classList.remove('btn-info');
                button.classList.add('btn-warning');
            }
        }

        // 获取逐笔成交数据
        async function getTickData() {
            try {
                const code = document.getElementById('tickCode').value;
                const startTime = document.getElementById('startTime').value;
                const endTime = document.getElementById('endTime').value;
                
                if (!code || !startTime || !endTime) {
                    alert('请填写完整的查询条件');
                    return;
                }
                
                const response = await fetch(`/api/v1/realtime/ticks/${code}?start_time=${startTime}&end_time=${endTime}&source=jq`);
                const result = await response.json();
                
                if (result.success) {
                    displayTickData(result.data.ticks);
                } else {
                    alert('获取逐笔成交数据失败: ' + result.message);
                }
            } catch (error) {
                console.error('获取逐笔成交数据失败:', error);
                alert('获取逐笔成交数据失败');
            }
        }

        // 显示逐笔成交数据
        function displayTickData(ticks) {
            const tbody = document.getElementById('tickTableBody');
            tbody.innerHTML = '';
            
            ticks.slice(0, 100).forEach(tick => { // 只显示前100条
                const row = document.createElement('tr');
                const directionClass = tick.direction === 'buy' ? 'text-success' : 'text-danger';
                const directionIcon = tick.direction === 'buy' ? '↑' : '↓';
                
                row.innerHTML = `
                    <td>${new Date(tick.timestamp).toLocaleTimeString()}</td>
                    <td class="fw-bold">${tick.price.toFixed(2)}</td>
                    <td>${tick.volume}</td>
                    <td>${(tick.amount / 1000).toFixed(0)}K</td>
                    <td class="${directionClass}">${directionIcon} ${tick.direction}</td>
                    <td>${tick.sequence}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // 加载市场概览
        async function loadMarketOverview() {
            try {
                const response = await fetch('/api/v1/realtime/market-overview');
                const result = await response.json();
                
                if (result.success) {
                    displayMarketOverview(result.data);
                }
            } catch (error) {
                console.error('加载市场概览失败:', error);
            }
        }

        // 显示市场概览
        function displayMarketOverview(data) {
            const container = document.getElementById('marketOverview');
            container.innerHTML = '';
            
            Object.entries(data.market_data).forEach(([code, quote]) => {
                const col = document.createElement('div');
                col.className = 'col-md-4 mb-3';
                col.innerHTML = `
                    <div class="card">
                        <div class="card-body text-center">
                            <h6 class="card-title">${quote.name}</h6>
                            <h4 class="text-primary">${quote.price.toFixed(2)}</h4>
                            <p class="text-muted mb-0">${quote.code}</p>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        // 加载数据质量
        async function loadDataQuality() {
            try {
                const response = await fetch('/api/v1/realtime/quality-report');
                const result = await response.json();
                
                if (result.success) {
                    displayDataQuality(result.data);
                }
            } catch (error) {
                console.error('加载数据质量报告失败:', error);
            }
        }

        // 显示数据质量
        function displayDataQuality(data) {
            // 创建质量图表
            if (qualityChart) {
                qualityChart.destroy();
            }
            
            const ctx = document.getElementById('qualityChart').getContext('2d');
            const labels = Object.keys(data.source_quality);
            const scores = labels.map(source => data.source_quality[source].overall_score);
            
            qualityChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '数据质量分数',
                        data: scores,
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 1
                        }
                    }
                }
            });
            
            // 显示质量告警
            const alertsContainer = document.getElementById('qualityAlerts');
            alertsContainer.innerHTML = '';
            
            if (data.alerts.length > 0) {
                data.alerts.forEach(alert => {
                    const alertDiv = document.createElement('div');
                    alertDiv.className = `alert alert-${alert.level === 'warning' ? 'warning' : 'danger'} alert-dismissible fade show`;
                    alertDiv.innerHTML = `
                        <strong>${alert.source}</strong> ${alert.message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    alertsContainer.appendChild(alertDiv);
                });
            } else {
                alertsContainer.innerHTML = '<div class="alert alert-success">所有数据源质量良好</div>';
            }
        }

        // 加载性能指标
        async function loadPerformanceMetrics() {
            try {
                const response = await fetch('/api/v1/realtime/performance');
                const result = await response.json();
                
                if (result.success) {
                    displayPerformanceMetrics(result.data);
                }
            } catch (error) {
                console.error('加载性能指标失败:', error);
            }
        }

        // 显示性能指标
        function displayPerformanceMetrics(data) {
            // 创建性能图表
            if (performanceChart) {
                performanceChart.destroy();
            }
            
            const ctx = document.getElementById('performanceChart').getContext('2d');
            performanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['缓存命中率', '平均延迟', '数据新鲜度', '吞吐量', '错误率'],
                    datasets: [{
                        label: '性能指标',
                        data: [
                            data.cache_hit_rate * 100,
                            data.average_latency_ms,
                            data.data_freshness_seconds,
                            data.throughput_queries_per_second,
                            data.error_rate * 100
                        ],
                        backgroundColor: [
                            'rgba(75, 192, 192, 0.6)',
                            'rgba(255, 99, 132, 0.6)',
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 205, 86, 0.6)',
                            'rgba(255, 159, 64, 0.6)'
                        ]
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
            
            // 显示性能指标详情
            const metricsContainer = document.getElementById('performanceMetrics');
            metricsContainer.innerHTML = `
                <div class="row">
                    <div class="col-6">
                        <div class="card text-center mb-2">
                            <div class="card-body">
                                <h6 class="card-title">可用性</h6>
                                <h4 class="text-success">${data.uptime_percentage}%</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card text-center mb-2">
                            <div class="card-body">
                                <h6 class="card-title">缓存命中率</h6>
                                <h4 class="text-info">${(data.cache_hit_rate * 100).toFixed(1)}%</h4>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <div class="card text-center mb-2">
                            <div class="card-body">
                                <h6 class="card-title">平均延迟</h6>
                                <h4 class="text-warning">${data.average_latency_ms}ms</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card text-center mb-2">
                            <div class="card-body">
                                <h6 class="card-title">错误率</h6>
                                <h4 class="text-danger">${(data.error_rate * 100).toFixed(2)}%</h4>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 订阅数据
        async function subscribeData() {
            try {
                const codes = document.getElementById('subscribeCodes').value.split(',').map(c => c.trim());
                const source = document.getElementById('dataSource').value;
                
                if (codes.length === 0 || !codes[0]) {
                    alert('请输入股票代码');
                    return;
                }
                
                const response = await fetch('/api/v1/realtime/subscribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ codes, source })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentSubscriptionId = result.data.subscription_id;
                    alert('订阅成功！订阅ID: ' + currentSubscriptionId);
                } else {
                    alert('订阅失败: ' + result.message);
                }
            } catch (error) {
                console.error('订阅数据失败:', error);
                alert('订阅数据失败');
            }
        }

        // 取消订阅
        async function unsubscribeData() {
            if (!currentSubscriptionId) {
                alert('没有活动的订阅');
                return;
            }
            
            try {
                const response = await fetch(`/api/v1/realtime/unsubscribe/${currentSubscriptionId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentSubscriptionId = null;
                    alert('取消订阅成功');
                } else {
                    alert('取消订阅失败: ' + result.message);
                }
            } catch (error) {
                console.error('取消订阅失败:', error);
                alert('取消订阅失败');
            }
        }

        // 页面卸载时清理
        window.addEventListener('beforeunload', function() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            if (currentSubscriptionId) {
                unsubscribeData();
            }
        });
    </script>
</body>
</html>
